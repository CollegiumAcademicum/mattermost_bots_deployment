services:
  postbot:
    image: ghcr.io/collegiumacademicum/mattermost-postbot:latest
    labels:
      io.containers.autoupdate: registry
    volumes:
      - ./.env:/app/.env:ro,z
      - ./data/postbot:/app/data:z
    networks:
      - internal
    restart: unless-stopped

  webui:
    image: ghcr.io/collegiumacademicum/mattermost-webui:latest
    labels:
      io.containers.autoupdate: registry
    env_file: .env
    networks:
      - internal
      - www
    depends_on:
      - postbot
    volumes:
      - ./data/webui:/app/data:z
      - ./data/certs:/app/certs:ro,z
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  www:
    external: true